<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Music Generator</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>🎵 AI Music Generator</h1>

    <p class="subtitle">
        CodeAlpha AI Internship - Task 3
    </p>

    <div class="card">

        <h2>Generate AI Music</h2>

        <label>Select Music Style</label>

        <select id="musicStyle">

            <option value="Piano">🎹 Piano</option>
            <option value="Classical">🎼 Classical</option>
            <option value="Jazz">🎷 Jazz</option>

        </select>

        <button id="generateBtn">
            🎵 Generate Music
        </button>

        <div id="loading" class="hidden">
            <p>Generating AI Music...</p>
        </div>

        <div id="result" class="hidden">

            <h3>✅ Music Generated Successfully!</h3>

            <p>Your AI-generated MIDI file is ready.</p>

            <a id="downloadLink" href="#">
                <button class="downloadBtn">
                    ⬇ Download MIDI
                </button>
            </a>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
